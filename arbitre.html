<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover : expose env(safe-area-inset-*) pour le padding du body -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Marqueur de Score & Chrono Arbitre - TIP</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Couche de coque propre à l'écran arbitre : le body est partagé par
       toutes les pages, les composants .ref-* vivent dans style.css.
       Marges 12px + zones sûres de l'écran (encoche / gestes iOS, Android). */
    body {
      background: var(--color-canvas, #000000);
      color: var(--color-ink, #F5F7FA);
      font-family: var(--font-body, system-ui, -apple-system, sans-serif);
      margin: 0 auto;
      max-width: 640px; /* tenu en main : largeur plafonnée, centrée ailleurs */
      padding:
        calc(12px + env(safe-area-inset-top, 0px))
        calc(12px + env(safe-area-inset-right, 0px))
        calc(12px + env(safe-area-inset-bottom, 0px))
        calc(12px + env(safe-area-inset-left, 0px));
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body>

  <!-- ÉCRAN DE CONNEXION ARBITRE (mot de passe distinct de l'admin, login obligatoire : Échap ne le ferme pas) -->
  <div id="ref-login-modal" class="login-overlay" role="dialog" aria-modal="true" aria-labelledby="ref-login-title" tabindex="-1">
    <div class="login-box">
      <h2 id="ref-login-title">Accès arbitre</h2>
      <p>Veuillez saisir le mot de passe arbitre</p>
      <form onsubmit="handleRefereeLogin(event)" class="ref-login-form">
        <label for="ref-pwd-input" class="ref-login-label">Mot de passe arbitre</label>
        <input type="password" id="ref-pwd-input" placeholder="Mot de passe..." required autofocus />
        <div id="ref-login-error" style="color:var(--accent-danger); font-size:0.85rem; display:none;">Mot de passe incorrect.</div>
        <button type="submit" class="btn btn-primary ref-login-submit">Déverrouiller l'interface arbitre</button>
      </form>
    </div>
  </div>

  <!-- EN-TÊTE COMPACT (non collant) : titre, choix du match, verrouillage -->
  <header class="ref-header">
    <div class="ref-header-top">
      <h1 class="ref-header-title">TIP Arbitre</h1>
      <button id="ref-logout-btn" class="ref-btn-quiet" onclick="lockRefereeView()" title="Verrouiller l'interface arbitre">Verrouiller</button>
    </div>
    <select id="ref-match-id-select" class="ref-match-selector" onchange="switchCurrentMatch(this.value)" aria-label="Choisir le match en cours">
      <!-- Options injectées en JS : Match 1, Match 2, ... -->
    </select>
  </header>

  <main>
    <!-- PROJECTION : action pleine largeur, explication visible si l'écran est occupé -->
    <div class="ref-proj-row">
      <button id="ref-proj-btn" class="ref-proj-btn" onclick="toggleProjection()">Projeter plein écran</button>
      <p id="ref-proj-note" class="ref-proj-note" role="status" hidden></p>
    </div>

    <!-- CHRONOMÈTRE : chiffres condensés à largeur fixe, durée réglable -->
    <div class="ref-timer-section">
      <div id="ref-timer-display" class="ref-timer-big">10:00</div>
      <div class="ref-timer-controls">
        <button id="ref-timer-toggle-btn" class="ref-timer-btn btn-primary" onclick="toggleTimer()">Démarrer</button>
        <button id="ref-timer-reset-btn" class="ref-timer-btn ref-timer-reset" onclick="resetTimer()">Réinitialiser le chrono</button>
      </div>
      <div class="ref-time-picker-row">
        <label for="ref-wheel-min">Minutes</label>
        <select id="ref-wheel-min" class="ref-wheel-select" onchange="onWheelTimeChange()">
          <!-- Options 00 à 60 minutes -->
        </select>
        <label for="ref-wheel-sec">Secondes</label>
        <select id="ref-wheel-sec" class="ref-wheel-select" onchange="onWheelTimeChange()">
          <!-- Options 00 à 59 secondes -->
        </select>
      </div>
    </div>

    <!-- DEUX ÉQUIPES : FILET FILIÈRE 4PX, SÉLECTEUR, SCORE EN ENCRE, +1 DOMINANT -->
    <div class="ref-teams-grid">
      <!-- ÉQUIPE A -->
      <div class="ref-team-box" id="ref-card-a">
        <span class="ref-team-tag" aria-hidden="true">Équipe A</span>
        <select id="ref-filiere-a" class="ref-filiere-select" onchange="onFiliereChange('A')" aria-label="Filière équipe A">
          <!-- Rempli en JS avec les filières -->
        </select>
        <div id="ref-score-a" class="ref-score-big">0</div>
        <div class="ref-score-actions">
          <button class="btn-score-big btn-plus" onclick="changeScore('A', 1)" aria-label="Ajouter 1 point à l'équipe A">+1</button>
          <button class="btn-score-big btn-minus" onclick="changeScore('A', -1)" aria-label="Retirer 1 point à l'équipe A">-1</button>
        </div>
      </div>

      <!-- ÉQUIPE B -->
      <div class="ref-team-box" id="ref-card-b">
        <span class="ref-team-tag" aria-hidden="true">Équipe B</span>
        <select id="ref-filiere-b" class="ref-filiere-select" onchange="onFiliereChange('B')" aria-label="Filière équipe B">
          <!-- Rempli en JS avec les filières -->
        </select>
        <div id="ref-score-b" class="ref-score-big">0</div>
        <div class="ref-score-actions">
          <button class="btn-score-big btn-plus" onclick="changeScore('B', 1)" aria-label="Ajouter 1 point à l'équipe B">+1</button>
          <button class="btn-score-big btn-minus" onclick="changeScore('B', -1)" aria-label="Retirer 1 point à l'équipe B">-1</button>
        </div>
      </div>
    </div>

    <!-- PERSONNALISATION : repliée, ids et handlers inchangés -->
    <details class="ref-personalize">
      <summary>Personnaliser le titre et les noms</summary>
      <div class="ref-personalize-body">
        <label for="ref-match-title" class="ref-field-label">Titre du match</label>
        <input type="text" id="ref-match-title" value="FINALE FOOTBALL" placeholder="Titre (ex: FINALE FOOTBALL, 1/2 VOLLEY, MATCH 2...)" onchange="onMetaChange()" />
        <label for="ref-name-a" class="ref-field-label">Nom équipe A</label>
        <input type="text" id="ref-name-a" value="Matméca" placeholder="Nom Équipe A" onchange="onMetaChange()" />
        <label for="ref-name-b" class="ref-field-label">Nom équipe B</label>
        <input type="text" id="ref-name-b" value="Elec" placeholder="Nom Équipe B" onchange="onMetaChange()" />
      </div>
    </details>

    <!-- ACTIONS SECONDAIRES + LIENS VERS LES AUTRES INTERFACES -->
    <div class="ref-actions-footer">
      <button class="ref-btn-quiet" onclick="resetScores()">Réinitialiser scores (0 - 0)</button>
      <button class="ref-btn-quiet" onclick="addNewLiveMatchSlot()">Nouveau match</button>
    </div>
    <nav class="ref-links-row" aria-label="Autres interfaces">
      <a href="admin.html" target="_blank" rel="noopener" class="ref-link">Administration</a>
      <a href="index.html" target="_blank" rel="noopener" class="ref-link">Affichage public</a>
    </nav>
  </main>

  <script src="app.js"></script>
  <script>
    // ID du match actuellement sélectionné par cet arbitre
    let currentMatchId = "match_1";

    // Récupérer l'ID depuis l'URL si fourni (ex: arbitre.html?match=match_2)
    // ⚠️ validation stricte : l'ID repart ensuite dans innerHTML et dans l'URL
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const mParam = urlParams.get("match");
      if (mParam && /^match_[A-Za-z0-9_-]{1,64}$/.test(mParam)) currentMatchId = mParam;
    } catch (e) {}

    // ========================================================================
    // 🔒 AUTHENTIFICATION ARBITRE
    // Le mot de passe arbitre est vérifié par le serveur (POST /api/login,
    // role "referee"). Le jeton obtenu ne permet QUE d'écrire les matchs en
    // direct : il est distinct du jeton admin et propre à cet onglet.
    // ========================================================================
    let refereeAuthenticated = false;
    let refereeSyncStarted = false;
    let refLoginOpener = null;

    // Tant que le login obligatoire est affiché, l'en-tête et le contenu
    // deviennent inaccessibles au clavier et aux lecteurs d'écran (inert).
    function setRefereeLoginLocked(locked) {
      [document.querySelector("header.ref-header"), document.querySelector("main")]
        .forEach(el => { if (el) el.inert = locked; });
    }

    function handleRefereeLogin(e) {
      e.preventDefault();
      const input = document.getElementById("ref-pwd-input");
      const errEl = document.getElementById("ref-login-error");
      const val = input ? input.value : "";
      if (errEl) errEl.style.display = "none";
      loginReferee(val).then(res => {
        if (res.success) {
          if (input) input.value = "";
          unlockRefereeView();
        } else if (errEl) {
          errEl.textContent = res.message || "Mot de passe incorrect.";
          errEl.style.display = "block";
        }
      });
    }

    function unlockRefereeView() {
      refereeAuthenticated = true;
      const modal = document.getElementById("ref-login-modal");
      if (modal) modal.classList.add("hidden");
      setRefereeLoginLocked(false);
      // Rend le focus au contrôle déclencheur (le bouton "Verrouiller")
      if (refLoginOpener && refLoginOpener.isConnected) refLoginOpener.focus();
      refLoginOpener = null;
      renderRefereeView();
      if (!refereeSyncStarted) {
        refereeSyncStarted = true;
        initServerSync(() => {
          if (refereeAuthenticated) renderRefereeView();
        });
      }
    }

    function lockRefereeView() {
      try { sessionStorage.removeItem("REFEREE_AUTH_TOKEN"); } catch (e) {}
      refereeAuthenticated = false;
      refLoginOpener = document.activeElement; // le bouton "Verrouiller"
      const modal = document.getElementById("ref-login-modal");
      if (modal) modal.classList.remove("hidden");
      setRefereeLoginLocked(true);
      const input = document.getElementById("ref-pwd-input");
      if (input) {
        input.value = "";
        setTimeout(() => input.focus(), 50);
      }
    }

    // Remplir les sélecteurs de durée (0 à 60 minutes, 0 à 59 secondes)
    function populateWheelSelects() {
      const minSel = document.getElementById("ref-wheel-min");
      const secSel = document.getElementById("ref-wheel-sec");
      if (!minSel || !secSel) return;

      let minHtml = "";
      for (let m = 0; m <= 60; m++) {
        minHtml += `<option value="${m}">${String(m).padStart(2, "0")}</option>`;
      }
      minSel.innerHTML = minHtml;

      let secHtml = "";
      for (let s = 0; s < 60; s++) {
        secHtml += `<option value="${s}">${String(s).padStart(2, "0")}</option>`;
      }
      secSel.innerHTML = secHtml;
    }

    // Initialisation des filières dans les selects
    function populateFiliereSelects() {
      const selA = document.getElementById("ref-filiere-a");
      const selB = document.getElementById("ref-filiere-b");
      if (!selA || !selB) return;

      const optsHtml = FILIERES.map(f => {
        return `<option value="${escapeHtml(f.id)}" data-color="${f.hex}">${escapeHtml(f.name)} (${escapeHtml(f.colorName)})</option>`;
      }).join("");

      selA.innerHTML = optsHtml;
      selB.innerHTML = optsHtml;
    }

    // Assure l'existence du tableau de matches et renvoie le match actuel
    function getActiveMatchRecord(state) {
      if (!state.liveMatches || typeof state.liveMatches !== "object") {
        state.liveMatches = {};
      }
      // Migration rétrocompatible depuis liveScore unique
      if (Object.keys(state.liveMatches).length === 0) {
        state.liveMatches["match_1"] = {
          id: "match_1",
          active: Boolean(state.liveScore && state.liveScore.active),
          title: (state.liveScore && state.liveScore.title) || "FINALE FOOTBALL",
          teamAName: (state.liveScore && state.liveScore.teamAName) || "Matméca",
          teamAColor: (state.liveScore && state.liveScore.teamAColor) || "#ef4444",
          teamAFiliereId: (state.liveScore && state.liveScore.teamAFiliereId) || "matmeca",
          scoreA: (state.liveScore && state.liveScore.scoreA) || 0,
          teamBName: (state.liveScore && state.liveScore.teamBName) || "Elec",
          teamBColor: (state.liveScore && state.liveScore.teamBColor) || "#2563eb",
          teamBFiliereId: (state.liveScore && state.liveScore.teamBFiliereId) || "elec",
          scoreB: (state.liveScore && state.liveScore.scoreB) || 0,
          timerMinutes: (state.liveScore && state.liveScore.timerMinutes !== undefined) ? state.liveScore.timerMinutes : 10,
          timerSeconds: (state.liveScore && state.liveScore.timerSeconds !== undefined) ? state.liveScore.timerSeconds : 0,
          timerRunning: (state.liveScore && state.liveScore.timerRunning) || false,
          timerEndsAt: (state.liveScore && state.liveScore.timerEndsAt) || null,
          timerRemainingOnPause: (state.liveScore && state.liveScore.timerRemainingOnPause !== undefined) ? state.liveScore.timerRemainingOnPause : 600,
          updatedAt: Date.now()
        };
      }

      if (!state.liveMatches[currentMatchId]) {
        state.liveMatches[currentMatchId] = {
          id: currentMatchId,
          active: false,
          title: "MATCH " + String(currentMatchId).replace("match_", "").replace(/[^A-Za-z0-9 _-]/g, ""),
          teamAName: "Info",
          teamAColor: "#22c55e",
          teamAFiliereId: "info",
          scoreA: 0,
          teamBName: "Télécom",
          teamBColor: "#facc15",
          teamBFiliereId: "telecom",
          scoreB: 0,
          timerMinutes: 10,
          timerSeconds: 0,
          timerRunning: false,
          timerEndsAt: null,
          timerRemainingOnPause: 600,
          updatedAt: Date.now()
        };
      }

      return state.liveMatches[currentMatchId];
    }

    // Synchroniser liveScore (pour rétrocompatibilité de l'index vidéoprojecteur)
    function syncLiveScoreObject(state) {
      if (!state.liveMatches) return;
      // Trouver le match actuellement projeté
      let projectedMatch = Object.values(state.liveMatches).find(m => m.active);
      if (projectedMatch) {
        state.liveScore = { ...projectedMatch };
      } else {
        // Aucun n'est projeté
        if (state.liveMatches[currentMatchId]) {
          state.liveScore = { ...state.liveMatches[currentMatchId], active: false };
        } else {
          state.liveScore = { active: false };
        }
      }
    }

    // Mettre à jour la liste déroulante des matchs disponibles
    function updateMatchIdSelect(state) {
      const select = document.getElementById("ref-match-id-select");
      if (!select) return;

      const escapeHtml = (s) => {
        const div = document.createElement("div");
        div.textContent = String(s ?? "");
        return div.innerHTML;
      };
      const matches = Object.values(state.liveMatches || {});
      select.innerHTML = matches.map(m => {
        const safeId = escapeHtml(m.id);
        const star = m.active ? " (projeté)" : "";
        return `<option value="${safeId}" ${m.id === currentMatchId ? "selected" : ""}>Match ${escapeHtml(String(m.id).replace("match_", ""))}: ${escapeHtml(m.title || "Match")}${star}</option>`;
      }).join("");
    }

    function switchCurrentMatch(matchId) {
      if (!/^match_[A-Za-z0-9_-]{1,64}$/.test(String(matchId))) return;
      currentMatchId = matchId;
      try {
        const url = new URL(window.location);
        url.searchParams.set("match", matchId);
        window.history.replaceState({}, "", url);
      } catch (e) {}
      renderRefereeView();
    }

    function addNewLiveMatchSlot() {
      const state = loadState();
      if (!state.liveMatches) state.liveMatches = {};
      const count = Object.keys(state.liveMatches).length + 1;
      const newId = `match_${count}`;
      state.liveMatches[newId] = {
        id: newId,
        active: false,
        title: `MATCH ${count}`,
        teamAName: "Matméca",
        teamAColor: "#ef4444",
        teamAFiliereId: "matmeca",
        scoreA: 0,
        teamBName: "SEE",
        teamBColor: "#f472b6",
        teamBFiliereId: "see",
        scoreB: 0,
        timerMinutes: 10,
        timerSeconds: 0,
        timerRunning: false,
        timerEndsAt: null,
        timerRemainingOnPause: 600,
        updatedAt: Date.now()
      };
      saveLiveState(state);
      switchCurrentMatch(newId);
    }

    function renderRefereeView() {
      const state = loadState();
      const live = getActiveMatchRecord(state);
      updateMatchIdSelect(state);

      const titleEl = document.getElementById("ref-match-title");
      const selA = document.getElementById("ref-filiere-a");
      const selB = document.getElementById("ref-filiere-b");
      const nameA = document.getElementById("ref-name-a");
      const nameB = document.getElementById("ref-name-b");
      const scoreAEl = document.getElementById("ref-score-a");
      const scoreBEl = document.getElementById("ref-score-b");
      const cardA = document.getElementById("ref-card-a");
      const cardB = document.getElementById("ref-card-b");
      const projBtn = document.getElementById("ref-proj-btn");
      const projNote = document.getElementById("ref-proj-note");
      const minWheel = document.getElementById("ref-wheel-min");
      const secWheel = document.getElementById("ref-wheel-sec");

      if (titleEl && document.activeElement !== titleEl) {
        titleEl.value = live.title || "FINALE";
      }

      // Filière A : la couleur filière ne vit que sur le filet haut de 4px,
      // le score reste en encre (couleur de texte jamais posée en JS)
      if (selA && live.teamAFiliereId) {
        selA.value = live.teamAFiliereId;
      }
      if (nameA && document.activeElement !== nameA) {
        nameA.value = live.teamAName || "Équipe A";
      }
      const colA = live.teamAColor || "#ef4444";
      if (cardA) cardA.style.borderTopColor = colA;
      if (scoreAEl) {
        scoreAEl.textContent = live.scoreA !== undefined ? live.scoreA : 0;
      }

      // Filière B
      if (selB && live.teamBFiliereId) {
        selB.value = live.teamBFiliereId;
      }
      if (nameB && document.activeElement !== nameB) {
        nameB.value = live.teamBName || "Équipe B";
      }
      const colB = live.teamBColor || "#2563eb";
      if (cardB) cardB.style.borderTopColor = colB;
      if (scoreBEl) {
        scoreBEl.textContent = live.scoreB !== undefined ? live.scoreB : 0;
      }

      // Molettes minutes et secondes
      if (minWheel && document.activeElement !== minWheel) {
        minWheel.value = live.timerMinutes !== undefined ? live.timerMinutes : 10;
      }
      if (secWheel && document.activeElement !== secWheel) {
        secWheel.value = live.timerSeconds !== undefined ? live.timerSeconds : 0;
      }

      // Gestion de la projection exclusive :
      // Vérifier si un AUTRE match est actuellement projeté
      let otherProjectedMatch = null;
      if (state.liveMatches) {
        otherProjectedMatch = Object.values(state.liveMatches).find(m => m.id !== currentMatchId && m.active);
      }

      if (projBtn) {
        if (live.active) {
          projBtn.className = "ref-proj-btn proj-live";
          projBtn.disabled = false;
          projBtn.innerHTML = "Retirer de l'écran";
          if (projNote) projNote.hidden = true;
        } else if (otherProjectedMatch) {
          // Un autre match est déjà projeté : bouton désactivé pour ce match,
          // l'explication est affichée en texte visible sous le bouton
          projBtn.className = "ref-proj-btn";
          projBtn.disabled = true;
          projBtn.innerHTML = "Écran occupé (" + escapeHtml(String(otherProjectedMatch.id).replace("match_", "Match ")) + ")";
          if (projNote) {
            projNote.textContent = `Écran occupé par "${otherProjectedMatch.title || otherProjectedMatch.id}" : ce match doit d'abord être retiré de l'écran.`;
            projNote.hidden = false;
          }
        } else {
          // Libre : peut être projeté
          projBtn.className = "ref-proj-btn";
          projBtn.disabled = false;
          projBtn.innerHTML = "Projeter plein écran";
          if (projNote) projNote.hidden = true;
        }
      }

      updateTimerUI(live);
    }

    function updateTimerUI(live) {
      const timerEl = document.getElementById("ref-timer-display");
      const toggleBtn = document.getElementById("ref-timer-toggle-btn");
      if (!timerEl) return;

      let remaining = 0;
      if (live.timerRunning && live.timerEndsAt) {
        remaining = Math.max(0, Math.round((live.timerEndsAt - Date.now()) / 1000));
      } else {
        const totalInitSec = ((live.timerMinutes || 0) * 60) + (live.timerSeconds || 0);
        remaining = live.timerRemainingOnPause !== undefined ? live.timerRemainingOnPause : (totalInitSec || 600);
      }

      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      timerEl.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;

      if (toggleBtn) {
        if (live.timerRunning) {
          toggleBtn.className = "ref-timer-btn btn-warning";
          toggleBtn.innerHTML = "Pause";
        } else {
          toggleBtn.className = "ref-timer-btn btn-primary";
          toggleBtn.innerHTML = "Démarrer";
        }
      }
    }

    function onWheelTimeChange() {
      const minWheel = document.getElementById("ref-wheel-min");
      const secWheel = document.getElementById("ref-wheel-sec");
      const m = parseInt(minWheel ? minWheel.value : 10, 10) || 0;
      const s = parseInt(secWheel ? secWheel.value : 0, 10) || 0;
      const totalSec = (m * 60) + s;

      const state = loadState();
      const live = getActiveMatchRecord(state);
      live.timerMinutes = m;
      live.timerSeconds = s;
      live.timerRunning = false;
      live.timerEndsAt = null;
      live.timerRemainingOnPause = totalSec;
      live.updatedAt = Date.now();

      syncLiveScoreObject(state);
      saveLiveState(state);
      renderRefereeView();
    }

    function onFiliereChange(team) {
      const state = loadState();
      const live = getActiveMatchRecord(state);

      if (team === "A") {
        const selA = document.getElementById("ref-filiere-a");
        const filId = selA.value;
        const fil = getFiliereById(filId);
        live.teamAFiliereId = fil.id;
        live.teamAName = fil.name;
        live.teamAColor = fil.hex;
      } else {
        const selB = document.getElementById("ref-filiere-b");
        const filId = selB.value;
        const fil = getFiliereById(filId);
        live.teamBFiliereId = fil.id;
        live.teamBName = fil.name;
        live.teamBColor = fil.hex;
      }

      live.updatedAt = Date.now();
      syncLiveScoreObject(state);
      saveLiveState(state);
      renderRefereeView();
    }

    function onMetaChange() {
      const state = loadState();
      const live = getActiveMatchRecord(state);

      const titleEl = document.getElementById("ref-match-title");
      const nameA = document.getElementById("ref-name-a");
      const nameB = document.getElementById("ref-name-b");

      if (titleEl) live.title = titleEl.value.trim() || "FINALE";
      if (nameA) live.teamAName = nameA.value.trim() || "Équipe A";
      if (nameB) live.teamBName = nameB.value.trim() || "Équipe B";

      live.updatedAt = Date.now();
      syncLiveScoreObject(state);
      saveLiveState(state);
      renderRefereeView();
    }

    function changeScore(team, delta) {
      const state = loadState();
      const live = getActiveMatchRecord(state);

      if (team === "A") {
        live.scoreA = Math.max(0, (live.scoreA || 0) + delta);
      } else {
        live.scoreB = Math.max(0, (live.scoreB || 0) + delta);
      }

      live.updatedAt = Date.now();
      syncLiveScoreObject(state);
      saveLiveState(state);
      renderRefereeView();
    }

    function resetScores() {
      if (confirm("Remettre les scores à 0 - 0 ?")) {
        const state = loadState();
        const live = getActiveMatchRecord(state);
        live.scoreA = 0;
        live.scoreB = 0;
        live.updatedAt = Date.now();
        syncLiveScoreObject(state);
        saveLiveState(state);
        renderRefereeView();
      }
    }

    function toggleTimer() {
      const state = loadState();
      const live = getActiveMatchRecord(state);

      if (live.timerRunning) {
        const remaining = Math.max(0, Math.round(((live.timerEndsAt || Date.now()) - Date.now()) / 1000));
        live.timerRunning = false;
        live.timerRemainingOnPause = remaining;
        live.timerEndsAt = null;
      } else {
        const totalInitSec = ((live.timerMinutes || 0) * 60) + (live.timerSeconds || 0);
        const durationSec = live.timerRemainingOnPause !== undefined ? live.timerRemainingOnPause : (totalInitSec || 600);
        const toRun = durationSec <= 0 ? (totalInitSec || 600) : durationSec;
        live.timerRemainingOnPause = toRun;
        live.timerRunning = true;
        live.timerEndsAt = Date.now() + (toRun * 1000);
      }

      live.updatedAt = Date.now();
      syncLiveScoreObject(state);
      saveLiveState(state);
      renderRefereeView();
    }

    function resetTimer() {
      const state = loadState();
      const live = getActiveMatchRecord(state);
      const totalInitSec = ((live.timerMinutes || 0) * 60) + (live.timerSeconds || 0);
      live.timerRunning = false;
      live.timerEndsAt = null;
      live.timerRemainingOnPause = totalInitSec || 600;
      live.updatedAt = Date.now();
      syncLiveScoreObject(state);
      saveLiveState(state);
      renderRefereeView();
    }

    function toggleProjection() {
      const state = loadState();
      const live = getActiveMatchRecord(state);

      if (!live.active) {
        // Tentative d'activer la projection pour ce match
        // Vérifier si un autre match est déjà projeté
        const occupied = Object.values(state.liveMatches || {}).find(m => m.id !== currentMatchId && m.active);
        if (occupied) {
          alert(`Impossible de projeter : le match "${occupied.title || occupied.id}" est déjà affiché en plein écran sur le vidéoprojecteur !\n\nL'autre arbitre ou l'admin doit d'abord le désactiver.`);
          return;
        }
        live.active = true;
      } else {
        // Désactivation
        live.active = false;
      }

      live.updatedAt = Date.now();
      syncLiveScoreObject(state);
      saveLiveState(state);
      renderRefereeView();
    }

    // Boucle de décompte du chrono et alarme de fin de match
    setInterval(() => {
      if (!refereeAuthenticated) return;
      const state = loadState();
      if (!state.liveMatches) return;
      const live = state.liveMatches[currentMatchId];
      if (live && live.timerRunning && live.timerEndsAt) {
        updateTimerUI(live);
        if (Date.now() >= live.timerEndsAt) {
          live.timerRunning = false;
          live.timerEndsAt = null;
          live.timerRemainingOnPause = 0;
          live.updatedAt = Date.now();
          syncLiveScoreObject(state);
          saveLiveState(state);
          renderRefereeView();
          if (typeof playMatchEndBuzzer === "function") {
            playMatchEndBuzzer();
          }
        }
      }
    }, 500);

    // Initialisation
    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      populateWheelSelects();
      populateFiliereSelects();

      // Accès protégé : sans jeton arbitre valide, on n'affiche que l'écran de connexion
      if (getRefereeToken()) {
        unlockRefereeView();
      } else {
        const modal = document.getElementById("ref-login-modal");
        if (modal) modal.classList.remove("hidden");
        setRefereeLoginLocked(true);
        const input = document.getElementById("ref-pwd-input");
        if (input) setTimeout(() => input.focus(), 50);
      }

      window.addEventListener("storage", () => {
        if (refereeAuthenticated) renderRefereeView();
      });
      window.addEventListener("tip:state_updated", () => {
        if (refereeAuthenticated) renderRefereeView();
      });
    });
  </script>
</body>
</html>
